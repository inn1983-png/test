<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 短剧工厂</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/result_summary.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">影</div>
        <div>
          <div class="brand-title">AI 短剧工厂</div>
          <div class="brand-sub">成果可视化工作台</div>
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-label">项目 ID</div>
        <input id="projectIdInput" placeholder="project_test_001" />
      </div>

      <div class="sidebar-section">
        <div class="sidebar-label">小说输入</div>
        <textarea id="novelTextInput" placeholder="粘贴小说正文，留空则使用已有文件" class="novel-input"></textarea>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-label">执行模式</div>
        <select id="imageModeInput"><option value="dry_run">图片：dry_run</option><option value="execute">图片：execute</option></select>
        <select id="audioModeInput"><option value="dry_run">音频：dry_run</option><option value="execute">音频：execute</option></select>
        <select id="videoModeInput"><option value="dry_run">视频：dry_run</option><option value="execute">视频：execute</option></select>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-label">快捷操作</div>
        <button class="btn primary full" id="startFullBtn">启动全流程 (00→10)</button>
        <button class="btn full" id="startTextBtn">文本链路 (00→06)</button>
        <button class="btn full" id="dataLinkBtn">数据链路检查</button>
        <button class="btn ghost full" id="selfCheckBtn">总控自检</button>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-label">分步运行</div>
        <div id="stepRunGrid" class="step-run-grid"></div>
        <div class="dep-check-area">
          <label class="dep-check-label"><input type="checkbox" id="skipDepCheck" /> 跳过依赖检查</label>
          <div id="depHint" class="dep-hint"></div>
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-label">已有项目</div>
        <div id="projectList" class="project-list"></div>
      </div>

      <div class="sidebar-foot">
        <button class="btn danger full" id="stopBtn" disabled>停止当前任务</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <span id="jobStatusBadge" class="status-dot"></span>
          <span id="jobStatusText">空闲</span>
        </div>
        <div class="topbar-right">
            <button id="btnHealthCheck" class="btn small" onclick="runHealthCheck()">系统健康检查</button>
            <button class="btn small" id="refreshBtn">刷新</button>
        </div>
      </header>

      <section class="pipeline-flow" id="pipelineFlow"></section>

      <section class="output-panel">
        <div class="output-header">
          <h2>成果工作台</h2>
          <div class="output-tabs">
            <button class="tab active" data-tab="stage">成果详情</button>
            <button class="tab" data-tab="repair">返工中心</button>
            <button class="tab" data-tab="stream">流水线日志</button>
          </div>
        </div>
        <div class="output-body">
          <div class="tab-content" id="tabStream">
            <pre id="liveLog" class="log-box">等待任务...</pre>
          </div>
          <div class="tab-content active" id="tabStage">
            <div id="stageDetail" class="stage-detail">点击上方模块，查看每个子系统的可读成果。</div>
          </div>
          <div class="tab-content" id="tabRepair">
            <div id="repairCenter" class="repair-center">选择项目后查看返工中心</div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="previewModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="previewTitle">预览</h2>
        <button class="btn ghost small" id="closePreviewBtn">关闭</button>
      </div>
      <pre id="previewContent" class="preview-content"></pre>
    </div>
  </div>

  <script src="/style_picker.js"></script>
  <script src="/app.js"></script>
  <script src="/app_globals.js"></script>
  <script src="/text_chain_patch.js"></script>
  <script src="/result_summary.js"></script>
  <script src="/review_notes.js"></script>
  <script src="/workbench_patch.js"></script>
</body>
</html>
